# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Vrai pour poser la CSP aussi en développement (elle n'est posée qu'hors debug sinon).
    env(APP_CSP): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        # Aucun appel réseau en test : la recherche de ville est remplacée par un double.
        App\Tests\Support\FakeGeocoder: ~
        App\Geocoding\GeocoderInterface: '@App\Tests\Support\FakeGeocoder'

        App\Tests\Support\FakeForecastProvider:
            autowire: true
        App\Forecast\HourlyTemperatureProviderInterface: '@App\Tests\Support\FakeForecastProvider'

        App\Tests\Support\FakeDailySunProvider:
            autowire: true
        App\Shutter\DailySunProviderInterface: '@App\Tests\Support\FakeDailySunProvider'

        App\Tests\Support\NoLeakHttpClient: ~

        # Journal d'audit en mémoire, lisible par les tests.
        test.audit_handler:
            alias: monolog.handler.audit_test
            public: true

        # Les limiteurs de débit gardent leur état entre deux exécutions : les tests le vident.
        test.cache.rate_limiter:
            alias: cache.rate_limiter
            public: true

        validator.not_compromised_password:
            class: Symfony\Component\Validator\Constraints\NotCompromisedPasswordValidator
            arguments:
                - '@App\Tests\Support\NoLeakHttpClient'
            tags:
                - { name: validator.constraint_validator }

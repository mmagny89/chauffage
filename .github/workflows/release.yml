# Publie une release GitHub quand une étiquette vX.Y.Z est poussée.
# Les notes sont la section correspondante de CHANGELOG.md : le journal reste la source unique.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    name: Publier la release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire les notes du journal des versions
        env:
          VERSION: ${{ github.ref_name }}
        run: sh outils/extraire-changelog.sh "${VERSION#v}" > notes.md

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" --title "$VERSION" --notes-file notes.md --verify-tag

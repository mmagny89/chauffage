# Surveillance des dépendances. Complète `composer audit`, porte qualité bloquante de
# .github/workflows/qualite.yml : l'audit refuse ce qui porte un avis de sécurité connu,
# Dependabot propose la montée de version qui le lève.
version: 2
updates:
  # Le code applicatif vit dans app/ ; la racine ne porte que l'infrastructure Docker
  # (voir .claude/rules/stack-conventions.md).
  - package-ecosystem: composer
    directory: /app
    # Les PR visent develop, comme tout le travail : main ne reçoit que des fusions de
    # develop. Dependabot lit ce fichier sur la branche par défaut : il doit donc aussi
    # être présent sur main pour prendre effet.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependances]
    commit-message:
      # Conventional Commits, comme le reste de l'historique.
      prefix: build
      include: scope
    groups:
      # Les paquets symfony/* sont contraints à la même version mineure : les monter un par
      # un produit N demandes qui échouent séparément et passent ensemble.
      symfony:
        patterns: ['symfony/*']
      doctrine:
        patterns: ['doctrine/*']
      qualite:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels: [dependances]
    commit-message:
      prefix: ci
